version: '3.8'

services:
  hydroxbot:
    build: .
    container_name: hydroxbot
    restart: unless-stopped
    
    # Environment variables (use .env file)
    env_file:
      - .env
    
    # Persist database
    volumes:
      - ./data:/app/data
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem (except data directory)
    read_only: true
    tmpfs:
      - /tmp
    
    # Drop all capabilities
    cap_drop:
      - ALL
